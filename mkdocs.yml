site_name: UCL EEE IoT Course
site_description: A hands-on tutorial for building an end-to-end IoT system with an Arduino, MQTT, AWS IoT Core, and AWS Lambda.
repo_name: David-GERARD/iot-button-system
repo_url: https://github.com/David-GERARD/iot-button-system
edit_uri: edit/main/docs/

theme:
  name: material
  logo: images/brand-VI-logo-horizontal-fullcolour-fullname.png.webp
  favicon: images/brand-VI-logo-horizontal-fullcolour-fullname.png.webp
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit

nav:
  - Home:
      - Home: home/index.md
      - Mini Project: home/mini-project.md
      - Group Project: home/group-project.md
  - Getting Started:
      - Setup Instructions: getting-started.md
      - Development Workflow: development-workflow.md
  - Session 1:
      - Lecture Notes: session1/content.md
      - "Mini Project Task 1": session1/task1.md
  - Session 2:
      - Lecture Notes: session2/content.md
      - "Mini Project Task 2": session2/task2.md
      - "Mini Project Task 3": session2/task3.md
  - Session 3:
      - Lecture Notes: session3/content.md
      - "Mini Project Task 4": session3/task4.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/David-GERARD/iot-button-system
